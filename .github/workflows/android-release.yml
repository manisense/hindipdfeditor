name: Android smoke test and release

# Run by hand from the Actions tab (or the API). Always builds a release APK and smoke-tests it on
# an emulator (mobile-app/scripts/android-smoke-test.sh). With "release" ticked and the smoke
# test green, it builds the store bundle on EAS and submits it to Google Play as a draft.
#
# Secrets:
#   EXPO_TOKEN                        required for the release job (expo.dev > Access tokens)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  optional; without it, submission uses the Google key
#                                     stored in the Expo account (eas.json "production-eas-key")
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'After a green smoke test, build on EAS and submit to Google Play (draft)'
        type: boolean
        default: false

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: 1
      - name: Build a release APK for the emulator's ABI
        working-directory: mobile-app/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: mobile-app
          script: ./scripts/android-smoke-test.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: mobile-app/smoke-artifacts
          if-no-files-found: ignore

  release:
    needs: smoke-test
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Check the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build the Play bundle on EAS
        run: eas build --platform android --profile production --non-interactive --wait
      - name: Choose the Play credentials
        id: play-key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$SERVICE_ACCOUNT_JSON" > google-play-service-account.json
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "profile=production-eas-key" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit to Google Play as a draft
        run: eas submit --platform android --profile ${{ steps.play-key.outputs.profile }} --latest --non-interactive
      - name: Remove the key file
        if: always()
        run: rm -f google-play-service-account.json
