name: 24-Hour Autonomous SEO, GEO & AEO Worker

# Schedule paused: daily templated articles risk Google's scaled-content policy.
# New guides are researched and written by hand; run manually only if a reviewed
# item is queued.
on:
  workflow_dispatch:
    # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  seo-daily-automation:
    name: Run 24h SEO Audit & Content Expansion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-app/editor/package-lock.json'

      - name: Install dependencies
        run: |
          npm --prefix web-app/editor ci --progress=false

      - name: Execute Autonomous SEO Worker (Publish Next Guide)
        run: |
          node web-app/scripts/seo-worker.mjs --publish-next

      - name: Run Web App Verification Tests
        run: |
          npm --prefix web-app/editor test

      - name: Build Production Web App
        run: |
          npm --prefix web-app/editor run build
          node web-app/scripts/prepare-publish.mjs

      - name: Commit & Push Daily SEO Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add web-app/
            git commit -m "chore(seo): daily 24h automated seo audit and article publication [skip ci]"
            git push origin main
            echo "Successfully deployed daily SEO improvements to main."
          else
            echo "No changes to commit. All SEO assets are up to date."
          fi
