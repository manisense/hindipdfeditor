name: Notify search engines (IndexNow)

# Manual resubmission of every sitemap URL to IndexNow (Bing, Yandex, Seznam, Naver).
# Each production deploy already submits them: the Cloudflare Workers Builds trigger for
# main runs `npm run deploy:ci` in web-app/editor (deploy, then web-app/scripts/indexnow.mjs),
# so submission does not depend on GitHub Actions minutes or billing.
on:
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Submit sitemap URLs
        run: node web-app/scripts/indexnow.mjs
